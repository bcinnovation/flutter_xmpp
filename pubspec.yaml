name: flutter_xmpp
description: Native XMPP socket for Flutter. Android uses Smack, iOS compiles the vendored camtalk-ios-v2 XMPPFramework sources.
version: 1.0.0
publish_to: none
homepage: https://github.com/adamdev718/flutter_xmpp

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.matenetworks.flutter_xmpp
        pluginClass: FlutterXmppPlugin
      ios:
        pluginClass: FlutterXmppPlugin
